name: Release

on:
  push:
    tags:
      - "v1.0.1"

permissions:
  contents: write

jobs:
  verify:
    name: Verify source and Linux SQLite runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Verify source tree has no database artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eiq '(^|/)(snablr|scan|results)(-[^/]*)?\.(db|sqlite|sqlite3|db3)$'; then
            echo "Tracked scan database found in release source" >&2
            exit 1
          fi

      - name: Test
        run: go test ./... -count=1

      - name: Race test Finder
        run: go test -race ./internal/findings -count=1

      - name: Vet
        run: go vet ./...

  build:
    name: Build Linux AMD64 (CGO SQLite)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Build and verify release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA}"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          package="snablr_${version}_linux_amd64"
          stage="dist/stage/${package}"
          mkdir -p "$stage"

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w -X snablr/internal/version.Version=${version} -X snablr/internal/version.Commit=${commit} -X snablr/internal/version.BuildDate=${build_date}" \
            -o "${stage}/snablr" ./cmd/snablr
          cp README.md LICENSE docs/building.md "${stage}/"

          actual_commit="$("${stage}/snablr" version | sed -n 's/.*commit: \([0-9a-f]*\).*/\1/p' | head -n1)"
          test "$actual_commit" = "$commit"
          "${stage}/snablr" --help | grep -q 'Browse persisted findings offline from SQLite'

          fixture="${RUNNER_TEMP}/synthetic-release-fixture.db"
          go run ./scripts/release-fixture "$fixture"
          finder_output="$("${stage}/snablr" find --db "$fixture" --list-id)"
          grep -q 'synthetic-release-smoke' <<<"$finder_output"

          members="$(tar -C dist/stage -czf "dist/${package}.tar.gz" "${package}" && tar -tzf "dist/${package}.tar.gz")"
          printf '%s\n' "$members"
          test "$(printf '%s\n' "$members" | wc -l)" -eq 5
          grep -qx "${package}/snablr" <<<"$members"
          if grep -Eiq '\.(db|sqlite|sqlite3|db3)$|(^|/)(id_rsa|credentials)$' <<<"$members"; then
            echo "Unexpected database or credential artifact in release archive" >&2
            exit 1
          fi

      - name: Upload verified archive
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download verified archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/releases
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: dist/releases
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Snablr ${{ github.ref_name }}
          body_path: docs/release-v1.0.1.md
          files: |
            dist/releases/*.tar.gz
            dist/releases/SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: true
