# Default defensive extension rules.
# Safe defaults: use these to prioritize review-worthy file types before expanding content rules.
# Noisy but useful: very common office/export extensions are disabled by default because they can flood results.
version: 1
name: defensive-extensions
description: Extension-based rules for sensitive config, script, key, office, and export triage.
rules:
  # Safe default: common human-readable configuration and environment files.
  - id: extension.sensitive_config_extensions
    name: Sensitive Config Extensions
    description: Prioritize configuration and environment file types that commonly contain sensitive settings.
    type: extension
    pattern: '^(\.cfg|\.conf|\.config|\.env|\.ini|\.json|\.properties|\.toml|\.xml|\.yaml|\.yml)$'
    case_sensitive: false
    severity: medium
    tags: [configuration, extensions, triage]
    category: configuration
    enabled: true
    include_paths: []
    exclude_paths: [node_modules, vendor, cache, temp, tmp]
    file_extensions: []
    max_file_size: 0
    action: prioritize

  # Safe default: scripts often carry operational settings and embedded credentials.
  - id: extension.script_extensions
    name: Script Extensions
    description: Flag script file extensions that often embed operational credentials or deployment settings.
    type: extension
    pattern: '^(\.bat|\.cmd|\.ps1|\.psm1|\.py|\.rb|\.sh|\.zsh)$'
    case_sensitive: false
    severity: medium
    tags: [scripts, extensions, triage]
    category: scripts
    enabled: true
    include_paths: []
    exclude_paths: [node_modules, vendor, cache, temp, tmp]
    file_extensions: []
    max_file_size: 0
    action: report

  # Safe default: cryptographic material extensions are high-value review targets.
  - id: extension.key_and_certificate_extensions
    name: Key And Certificate Extensions
    description: Prioritize key, certificate, and keystore file extensions for remediation review.
    type: extension
    pattern: '^(\.asc|\.cer|\.crt|\.csr|\.jks|\.key|\.pem|\.p12|\.pfx)$'
    case_sensitive: false
    severity: high
    tags: [crypto, certificates, extensions]
    category: crypto
    enabled: true
    include_paths: []
    exclude_paths: [cache, temp, tmp]
    file_extensions: []
    max_file_size: 0
    action: prioritize

  # Safe default: client-auth artifacts often provide direct VPN or SSH access context and deserve review.
  - id: extension.client_auth_artifacts
    name: Client Auth Artifact Extensions
    description: Prioritize common VPN and client-auth artifact extensions that often represent reusable access material.
    type: extension
    pattern: '^(\.ovpn|\.ppk)$'
    case_sensitive: false
    severity: high
    confidence: high
    explanation: These extensions are associated with VPN or client-auth artifacts rather than generic text files.
    remediation: Review whether the client-auth artifact belongs on the share, restrict access, and rotate or replace related credentials if exposure is confirmed.
    tags: [remote-access, vpn, client-auth, extensions, artifact:client-auth]
    category: remote-access
    enabled: true
    include_paths: []
    exclude_paths: [cache, temp, tmp]
    file_extensions: []
    max_file_size: 0
    action: prioritize

  # Noisy but useful: office and export file types are common and should usually be narrowed with include_paths or custom filename rules.
  - id: extension.office_and_export_extensions
    name: Office And Export Extensions
    description: Flag office, tabular, and export-oriented file types that are often useful for business-sensitive review.
    type: extension
    pattern: '^(\.csv|\.docx|\.pdf|\.txt|\.tsv|\.xls|\.xlsx)$'
    case_sensitive: false
    severity: medium
    tags: [business-data, office, exports]
    category: business-data
    enabled: false
    include_paths: []
    exclude_paths: [cache, temp, tmp]
    file_extensions: []
    max_file_size: 0
    action: report

  # Safe default: lightweight database and backup formats are high-value review targets.
  - id: extension.database_and_backup_extensions
    name: Database And Backup Extensions
    description: Prioritize database export, backup, and lightweight database files for remediation review.
    type: extension
    pattern: '^(\.accdb|\.bak|\.db|\.dmp|\.dump|\.mdb|\.sqlite|\.sqlite3)$'
    case_sensitive: false
    severity: high
    tags: [database, backups, extensions]
    category: archives
    enabled: true
    include_paths: []
    exclude_paths: [cache, temp, tmp]
    file_extensions: []
    max_file_size: 0
    action: prioritize

  # High value: virtual disks and VM memory/state files can be mounted or read offline
  # to extract SAM/SYSTEM/NTDS or LSASS secrets. Reported by name; content is not read.
  - id: extension.virtual_disk_and_memory_images
    name: Virtual Disk And VM Memory Images
    description: Report virtual machine disks and VM memory or saved-state files that may contain offline-extractable credential stores.
    type: extension
    pattern: '^(\.vhd|\.vhdx|\.avhd|\.avhdx|\.vmdk|\.vdi|\.qcow2|\.ova|\.ovf|\.vmem|\.vmsn|\.vmss)$'
    case_sensitive: false
    severity: high
    confidence: high
    explanation: Virtual disk and VM memory images can be copied and mounted offline to extract local SAM, SYSTEM and NTDS data or LSASS memory without touching the original host.
    remediation: Remove virtual disk and VM memory images from shared locations or restrict access to backup administrators, and treat credentials on the imaged systems as exposed.
    tags: [backups, vm-disks, offline-extraction, extensions]
    category: backup-exposure
    enabled: true
    include_paths: []
    exclude_paths: [cache, temp, tmp]
    file_extensions: []
    max_file_size: 0
    action: report

  # Review: optical and raw disk images are usually installation media, but deployment
  # and boot media can embed task-sequence or answer-file credentials.
  - id: extension.optical_disk_images
    name: Optical And Raw Disk Images
    description: Report ISO and raw disk images that may be deployment or boot media containing embedded configuration.
    type: extension
    pattern: '^(\.iso|\.img)$'
    case_sensitive: false
    severity: medium
    explanation: Deployment and boot media images can contain answer files, task-sequence variables or other embedded credentials.
    remediation: Confirm whether the image is deployment or boot media and restrict access if it embeds credentials or configuration.
    tags: [backups, disk-images, deployment, extensions]
    category: backup-exposure
    enabled: true
    include_paths: []
    exclude_paths: [cache, temp, tmp]
    file_extensions: []
    max_file_size: 0
    action: report

  # Review: mailbox stores often contain credentials, password resets and internal access details.
  - id: extension.mail_store_archives
    name: Mail Store Archives
    description: Report Outlook PST and OST mailbox stores on shares.
    type: extension
    pattern: '^(\.pst|\.ost)$'
    case_sensitive: false
    severity: medium
    explanation: Mailbox archives frequently contain credentials sent by email, password reset messages and other sensitive correspondence.
    remediation: Remove mailbox archives from shared locations or restrict access to the mailbox owner.
    tags: [mail, business-data, extensions]
    category: business-data
    enabled: true
    include_paths: []
    exclude_paths: [cache, temp, tmp]
    file_extensions: []
    max_file_size: 0
    action: report
